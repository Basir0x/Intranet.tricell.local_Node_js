<div class="page-section">
    <h1 class="section-title">Edit Employee</h1>
    
    <form name="newemployeeform" action="/api/editemployee/!{id}" onSubmit="return formCheckNewEmployee()" method="post" enctype="multipart/form-data" class="employee-form">
        <input type="hidden" name="MAX_FILE_SIZE" value="50000000" />
        <input type="hidden" name="fsignaturedate" value="!{signaturedate}" />

        <div class="form-container">
            <!-- Left Column: Photo and Security Info -->
            <div class="form-column form-column-photo">
                <div class="photo-section">
                    <div class="photo-box">
                        <img src="!{photo}" alt="Employee Photo" id="photoPreview" />
                    </div>
                    <label class="file-upload-label">
                        <input type="file" name="ffile" id="ffile" class="file-input" />
                        <span class="upload-text">Update Photo (JPG)</span>
                    </label>
                </div>

                <div class="form-group">
                    <label>EMPLOYEE CODE:</label>
                    <input type="text" name="femployeecode" id="femployeecode" maxlength="7" value="!{employeecode}" />
                </div>

                <div class="form-group">
                    <label>SECURITY CLEARANCE:</label>
                    <select name="fsecurityaccess" id="fsecurityaccess" class="form-control">
                        - if(securityaccesslevel=="C")
                            option(value="C", selected="selected") C - Standard
                        - else
                            option(value="C") C - Standard

                        - if(securityaccesslevel === "B")
                            option(value="B", selected="selected") B - High
                        - else
                            option(value="B") B - High

                        - if(securityaccesslevel === "A")
                            option(value="A", selected="selected") A - Top Secret
                        - else
                            option(value="A") A - Top Secret
                    </select>
                </div>
            </div>

            <!-- Right Column: Employee Details -->
            <div class="form-column form-column-details">
                <div class="form-row">
                    <div class="form-group">
                        <label>NAME:</label>
                        <input type="text" name="fname" id="fname" maxlength="255" value="!{name}" />
                    </div>
                    <div class="form-group">
                        <label>DATE OF BIRTH:</label>
                        <input type="date" name="fdateofbirth" id="fdateofbirth" value="!{dateofbirth}" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>SEX:</label>
                        <select name="fsex" id="fsex" class="form-control">
                            - if(sex == "Male")
                                option(value="Male", selected="selected") Male
                            - else
                                option(value="Male") Male
                            - if(sex == "Female")
                                option(value="Female", selected="selected") Female
                            - else
                                option(value="Female") Female
                            - if(sex == "Other")
                                option(value="Other", selected="selected") Other
                            - else
                                option(value="Other") Other
                        </select>
                    </div>
                    <div class="form-group">
                        <label>BLOOD TYPE:</label>
                        <input type="text" name="fbloodtype" id="fbloodtype" maxlength="4" value="!{bloodtype}" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>HEIGHT:</label>
                        <input type="text" name="fheight" id="fheight" maxlength="7" value="!{height}" />
                    </div>
                    <div class="form-group">
                        <label>WEIGHT:</label>
                        <input type="text" name="fweight" id="fweight" maxlength="7" value="!{weight}" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>DEPARTMENT:</label>
                        <input type="text" name="fdepartment" id="fdepartment" maxlength="255" value="!{department}" />
                    </div>
                    <div class="form-group">
                        <label>RANK:</label>
                        <input type="text" name="frank" id="frank" maxlength="255" value="!{rank}" />
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>BACKGROUND:</label>
                    <textarea name="fbackground" id="fbackground">!{background}</textarea>
                </div>

                <div class="form-group full-width">
                    <label>STRENGTHS:</label>
                    <textarea name="fstrengths" id="fstrengths">!{strengths}</textarea>
                </div>

                <div class="form-group full-width">
                    <label>WEAKNESSES:</label>
                    <textarea name="fweaknesses" id="fweaknesses">!{weaknesses}</textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update Employee</button>
                    <button type="reset" class="btn btn-secondary">Reset Form</button>
                </div>
            </div>
        </div>
    </form>
</div>
