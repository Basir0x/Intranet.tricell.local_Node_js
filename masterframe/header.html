<!---- Header Start ----------------------------------------------------------->
<header class="custom-header">
    <div id="headerCarousel" class="carousel slide" data-ride="carousel" data-interval="5000">
        <ol class="carousel-indicators">
            <li data-target="#headerCarousel" data-slide-to="0" class="active"></li>
            <li data-target="#headerCarousel" data-slide-to="1"></li>
            <li data-target="#headerCarousel" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img class="d-block w-100" src="images/Header_img_01.jpg" alt="Research laboratory slide" />
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="images/Header_img_02.jpg" alt="Laboratory innovation slide" />
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="images/Header_img_03.jpg" alt="Corporate science slide" />
            </div>
        </div>
        <a class="carousel-control-prev" href="#headerCarousel" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#headerCarousel" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
        </a>
    </div>
    <div class="header-overlay">
        <div class="header-inner">
            <div class="header-brand">
                <img class="header-logo" src="images/Tricell_logo.png" alt="Tricell Laboratories Inc." />
                <div class="header-copy">
                    <span class="eyebrow">Pharmaceutical Research &amp; Secure Laboratory Operations</span>
                    <h1>Tricell Laboratories Inc.</h1>
                    <p>Advancing health science with intelligent biosafety and world-class research.</p>
                </div>
            </div>
            <div class="header-social">
                <a href="http://www.facebook.com"><img src="images/social_icon_facebook.png" alt="Facebook" /></a>
                <a href="http://www.instagram.com"><img src="images/social_icon_instagram.png" alt="Instagram" /></a>
                <a href="http://www.linkedin.com"><img src="images/social_icon_linkedin.png" alt="Linkedin" /></a>
                <a href=""><img src="images/social_icon_phone.png" alt="Phone" /></a>
                <a href=""><img src="images/social_icon_www.png" alt="Website" /></a>
            </div>
        </div>
    </div>
</header>
<!---- Header End ----------------------------------------------------------->
