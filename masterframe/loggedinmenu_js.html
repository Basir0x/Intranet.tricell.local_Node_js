<script language="JavaScript">
    // Auto-hide menu and mouse detection for logged-in menu- there was a iisue where user loged in that logged in menu covered a part of some pages, so we decided to add a auto-hide feature to the menu, it will hide after 5 seconds of inactivity and will show again when user moves mouse to the right edge of the screen, also added a small indicator that shows when menu is hidden and can be clicked to show menu again
    let menuHideTimeout;
    let isMenuVisible = true;
    
    function autoHideMenu() {
        const menu = document.getElementById('loggedinMenuLayer');
        if (menu && isMenuVisible) {
            menu.classList.add('hidden');
            isMenuVisible = false;
            const indicator = document.getElementById('menuIndicator');
            if (indicator) indicator.classList.add('show');
        }
    }
    
    function showMenu() {
        const menu = document.getElementById('loggedinMenuLayer');
        if (menu && !isMenuVisible) {
            menu.classList.remove('hidden');
            isMenuVisible = true;
            const indicator = document.getElementById('menuIndicator');
            if (indicator) indicator.classList.remove('show');
            
            // Reset auto-hide timer
            clearTimeout(menuHideTimeout);
            menuHideTimeout = setTimeout(autoHideMenu, 5000);
        }
    }
    
    // Initialize menu auto-hide after 5 seconds
    document.addEventListener('DOMContentLoaded', function() {
        const menu = document.getElementById('loggedinMenuLayer');
        const indicator = document.getElementById('menuIndicator');
        
        if (menu) {
            // Create indicator if it doesn't exist
            if (!indicator) {
                const newIndicator = document.createElement('div');
                newIndicator.id = 'menuIndicator';
                document.body.appendChild(newIndicator);
            }
            
            // Auto-hide after 5 seconds on page load
            menuHideTimeout = setTimeout(autoHideMenu, 5000);
            
            // Show menu on mouse hover over right edge
            document.addEventListener('mousemove', function(e) {
                const threshold = 50; // pixels from right edge
                const mouseX = e.clientX;
                const windowWidth = window.innerWidth;
                
                if (windowWidth - mouseX < threshold) {
                    showMenu();
                }
            });
            
            // Show menu when clicking indicator
            if (indicator) {
                indicator.addEventListener('click', showMenu);
            }
            
            // Reset timer when user interacts with menu
            menu.addEventListener('mouseenter', function() {
                clearTimeout(menuHideTimeout);
            });
            
            menu.addEventListener('mouseleave', function() {
                menuHideTimeout = setTimeout(autoHideMenu, 3000);
            });
        }
    });
</script>

    <script language="JavaScript">
    function refreshChat()
    {
    const xhttp2 = new XMLHttpRequest();
    xhttp2.onload = function() 
    {
       document.getElementById("chatLayerMessages").innerHTML = this.responseText;
        var elem = document.getElementById('chatLayer');
        elem.scrollTop = elem.scrollHeight;
    }
    const baseUrl = window.location.protocol + "//" + window.location.host;
    xhttp2.open("GET", baseUrl + "/api/chat", true);
    xhttp2.send()
    }
    function showChatLayer()
    {
        if(document.getElementById('chatLayer').style.display=='block')
        {
            document.getElementById('chatLayer').style.display='none';
        }
        else
        {
            document.getElementById('chatLayer').style.display='block';
            refreshChat();
            setInterval(function() 
            {
                refreshChat();
            }, 5000); //5 seconds
        }
    }
    function submitChat()
    {
        var http = new XMLHttpRequest();
        const baseUrl = window.location.protocol + "//" + window.location.host;
        http.open("POST", baseUrl + "/api/chat", true);
        http.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
        var params = "MAX_FILE_SIZE=50000000&chatmessage=" + document.getElementById('chatmessage').value;
        http.send(params);
        http.onload = function() 
        {
            document.getElementById("chatmessage").value = this.responseText;
        }
    }
    </script>
    
    <script language="JavaScript">

    <!-- PANIC BUTTON SCRIPTS -->
    <script language="JavaScript">
    function showPanicLayer()
    {
        if(document.getElementById('panicLayer').style.display=='block')
        {
            document.getElementById('panicLayer').style.display='none';
        }
        else
        {
            document.getElementById('panicLayer').style.display='block';
            document.getElementById('panicresult').innerHTML = '';
            document.getElementById('paniccode').value = '';
        }
    }

    function submitPanic()
    {
        var code = document.getElementById('paniccode').value;

        if(code == '')
        {
            document.getElementById('panicresult').innerHTML = 'Enter panic code';
            return;
        }

        var hashedCode = hex_md5(code);

        var http = new XMLHttpRequest();
        const baseUrl = window.location.protocol + "//" + window.location.host;
        http.open("POST", baseUrl + "/api/panic", true);
        http.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
        http.send("paniccode=" + encodeURIComponent(hashedCode));

        http.onload = function()
        {
            document.getElementById('panicresult').innerHTML = this.responseText;

            if(this.responseText.includes("activated"))
            {
                setTimeout(function() {
                    window.location.href = baseUrl;
                }, 2000);
            }
        }
    }
    </script>
