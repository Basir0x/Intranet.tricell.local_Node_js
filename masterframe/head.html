<script language="JavaScript">
    let keys = {t: false, r: false};

    addEventListener("keydown", (event) => 
    {
      if (event.key === "t") 
      {
        keys.t = true;
      }
      if (event.key === "r") 
      {
        keys.r = true;
      }
      if(keys.t && keys.r)
      {
        document.getElementById("loginLayer").style.display = "block";
      }
    });

    addEventListener("keyup", (event) => 
    {
      if (event.key === "t") {
        keys.t = false;
      }
      if (event.key === "r") {
        keys.r = false;
      }
    });

    document.addEventListener("keydown", event => 
    { 
        if (event.key == "Escape") 
        {
            document.getElementById("loginLayer").style.display = "none";
        }
    });

    function hashing()
    {
        const form = document.querySelector('form[name="form"]');
        if(form && form.fpassword) {
            form.fpassword.value = hex_md5(form.fpassword.value);
        }
    }

    function formCheck()
    {
        const form = document.querySelector('form[name="form"]');
        if(!form) return false;
        
        if(form.femployeecode.value=="")
        {
            alert("You must give an employee code!");
            return false;
        }
        if(form.fpassword.value=="")
        {
            alert("You must give a password!");
            return false;
        }
        return true;
    }

    // Sidebar form functions
    function validateSidebarForm()
    {
        const form = document.getElementById('sidebarLoginForm');
        if(!form) return false;
        
        if(form.femployeecode.value == "")
        {
            alert("You must give an employee code!");
            return false;
        }
        if(form.fpassword.value == "")
        {
            alert("You must give a password!");
            return false;
        }
        return true;
    }

    function hashSidebarPassword()
    {
        const form = document.getElementById('sidebarLoginForm');
        if(form && form.fpassword) {
            form.fpassword.value = hex_md5(form.fpassword.value);
        }
    }

</script>
